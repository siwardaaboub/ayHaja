# Server
server.port=8080

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/climate_alerte
spring.datasource.username=postgres
spring.datasource.password=imen
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JW
app.jwt.secret=YourSecretKeyForJwtTokenGenerationMustBeAtLeast256BitsLong
app.jwt.expiration-ms=86400000

# Caching
spring.cache.type=simple
spring.cache.cache-names=current-weather,forecasts,historical-data,historical-yearly,historical-monthly

# Climate API
climate.api.timeout-seconds=10

# Logging
logging.level.org.springframework.security=DEBUG
logging.level.com.climateplatform=DEBUG
logging.level.com.climateplatform.climate=DEBUG
