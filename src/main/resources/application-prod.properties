# Production configuration for Climate Platform
# Override default settings for production environment

# Server
server.port=8080
server.servlet.context-path=/api

# Database
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/climate_platform}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:20}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:30000}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT:600000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME:1800000}

# JPA
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# JWT
app.jwt.secret=${JWT_SECRET:YourSecretKeyForJwtTokenGenerationMustBeAtLeast256BitsLong}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# AI Service
ai.openai.api-key=${OPENAI_API_KEY:}
ai.openai.model=${OPENAI_MODEL:gpt-4o-mini}
ai.openai.max-tokens=${OPENAI_MAX_TOKENS:2000}
ai.openai.temperature=${OPENAI_TEMPERATURE:0.7}
ai.openai.timeout-seconds=${AI_TIMEOUT_SECONDS:30}
ai.anthropic.api-key=${ANTHROPIC_API_KEY:}
ai.anthropic.model=${ANTHROPIC_MODEL:claude-3-sonnet-20240229}
ai.provider=${AI_PROVIDER:openai}

# Logging
logging.level.org.springframework=INFO
logging.level.com.climateplatform=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Cache
spring.cache.type=simple
spring.cache.cache-names=dashboard-summary,alert-rules,health-statistics,risk-distribution,current-weather,forecasts,historical-data,historical-yearly,historical-monthly,user-conversations

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoints.web.base-path=/actuator

# Server compression
server.compression.enabled=true
server.compression.mime-types=text/html,text/plain,text/xml,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024

# Security headers
server.http2.enabled=true
