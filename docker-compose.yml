version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: climate-platform-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${DATABASE_NAME:climate_platform}
      - POSTGRES_USER=${DATABASE_USERNAME:postgres}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD:postgres}
      - POSTGRES_INITDB_ARGS=--auth-host=scram-sha-256
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    networks:
      - climate-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:postgres}"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Backend Application
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: climate-platform-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=jdbc:postgresql://postgres:5432/${DATABASE_NAME:climate_platform}
      - DATABASE_USERNAME=${DATABASE_USERNAME:postgres}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:postgres}
      - JWT_SECRET=${JWT_SECRET:YourSecretKeyForJwtTokenGenerationMustBeAtLeast256BitsLong}
      - JWT_EXPIRATION_MS=${JWT_EXPIRATION_MS:86400000}
      - OPENAI_API_KEY=${OPENAI_API_KEY:}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:}
      - AI_PROVIDER=${AI_PROVIDER:openai}
      - SPRING_PROFILES_ACTIVE=prod
    ports:
      - "8080:8080"
    networks:
      - climate-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Frontend Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: climate-platform-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      - climate-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: climate-platform-nginx
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    networks:
      - climate-network
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis for caching (optional, for production)
  redis:
    image: redis:7-alpine
    container_name: climate-platform-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - climate-network
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  # Prometheus for monitoring
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: climate-platform-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - climate-network

  # Grafana for visualization
  grafana:
    image: grafana/grafana-enterprise:10.1.0
    container_name: climate-platform-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - climate-network

volumes:
  postgres_data:
  redis_data:
  grafana_data:

networks:
  climate-network:
    driver: bridge
